name: .NET CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. إعداد بيئة .NET
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 3. استعادة الحزم والبناء والاختبار
    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --no-restore --configuration Release

    - name: Run tests
      run: dotnet test --no-build --verbosity normal

    # 4. تسجيل الدخول إلى Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.NEWREYAD }}
        password: ${{ secrets.reyad11 }}

    # 5. بناء صورة Docker ورفعها أوتوماتيكياً
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: EventBooking.API/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/eventbooking-api:latest